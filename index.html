<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VPN Mini App</title>
    <!-- Подключаем Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background-color: var(--tg-theme-bg-color, #1c1c1e);
        color: var(--tg-theme-text-color, #ffffff);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        box-sizing: border-box;
      }

      .card {
        background-color: var(--tg-theme-secondary-bg-color, #2c2c2e);
        border-radius: 16px;
        padding: 24px;
        width: 100%;
        max-width: 360px;
        text-align: center;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      }

      h1 {
        font-size: 22px;
        margin-bottom: 8px;
      }

      p {
        font-size: 14px;
        color: #8e8e93;
        margin-bottom: 24px;
      }

      .btn {
        background-color: var(--tg-theme-button-color, #007aff);
        color: var(--tg-theme-button-text-color, #ffffff);
        border: none;
        border-radius: 12px;
        padding: 14px 20px;
        font-size: 16px;
        font-weight: 600;
        width: 100%;
        cursor: pointer;
        transition: opacity 0.2s;
      }

      .btn:active {
        opacity: 0.8;
      }

      .status-badge {
        display: inline-block;
        background-color: rgba(52, 199, 89, 0.15);
        color: #34c759;
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="status-badge">● Сервер активен</div>
      <h1 id="user-greeting">Привет!</h1>
      <p>Нажми на кнопку ниже, чтобы сгенерировать персональный VPN-ключ.</p>

      <button class="btn" onclick="generateKey()">⚡ Получить ключ</button>
    </div>

    <script>
      // Инициализация Telegram WebApp
      const tg = window.Telegram.WebApp;
      tg.expand(); // Разворачиваем окно на весь экран

      // Выводим имя пользователя из Telegram
      if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
        document.getElementById("user-greeting").innerText =
          `Привет, ${tg.initDataUnsafe.user.first_name}! 👋`;
      }

      function generateKey() {
        // Отправляем данные обратно в бота
        tg.sendData(JSON.stringify({ action: "get_vpn_key" }));
        tg.close(); // Закрываем Mini App
      }
    </script>
  </body>
</html>
